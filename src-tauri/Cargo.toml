[package]
name = "abyss-injector"
version = "0.1.5"
description = "Injecteur/patcheur autonome pour Abyss (fork Vencord/Equicord) — Tauri, indépendant de Skin Walker"
authors = ["lemonn"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
# Sélecteur de fichiers natif (export/import des préréglages de plugins).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Self-update « portable » (pas de NSIS/plugin-updater) : on remplace l'exe en
# cours d'exécution par le nouveau téléchargé depuis les GitHub Releases.
self-replace = "1"
# Comparaison de versions (tag de Release vs version courante).
semver = "1"
# Pour tuer le process Discord avant patch/unpatch (fichiers relâchés), sans
# FFI Win32 manuel — contrairement au Go original qui fait ça à la main via
# CreateToolhelp32Snapshot.
sysinfo = "0.32"
# Télécharge le build JS d'Abyss depuis abyss-builds (voir dist_fetch.rs).
# Features par défaut = native-tls -> Schannel sur Windows, donc aucune
# dépendance native supplémentaire (pas d'OpenSSL/NASM à installer en plus
# des Build Tools C++ déjà nécessaires pour compiler Tauri).
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
