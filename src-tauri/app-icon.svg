<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond : carré arrondi noir -->
  <rect width="1024" height="1024" rx="228" fill="#050505"/>

  <!-- Anneau (planète / trou noir) -->
  <circle cx="512" cy="512" r="210" fill="none" stroke="#ffffff" stroke-width="66"/>

  <!-- Lame diagonale effilée qui transperce l'anneau (bas-gauche -> haut-droite) -->
  <path d="M251.8,772.2 Q544.5,544.5 772.2,251.8 Q479.5,479.5 251.8,772.2 Z" fill="#ffffff"/>

  <!-- Deux fentes noires parallèles à la lame : séparent la lame de l'anneau
       (le "cut" élégant de la DA) -->
  <path d="M301.3,821.7 Q575,575 821.7,301.3 Q548,548 301.3,821.7 Z" fill="#050505"/>
  <path d="M202.3,722.7 Q476,476 722.7,202.3 Q449,449 202.3,722.7 Z" fill="#050505"/>
</svg>
